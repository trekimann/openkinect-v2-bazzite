# RMS energy threshold for speech activity on the raw 4-channel capture.
# Raise it for noisier rooms or constant fan noise; lower it if normal speech
# is not consistently detected at the intended seating distance.
AUDIO_VAD_THRESHOLD=0.0008
AUDIO_CONFIDENCE_THRESHOLD=0.20
AUDIO_MAX_ABS_AZIMUTH_DEG=65.0
AUDIO_MANUAL_AZIMUTH_DEG=0.0
AUDIO_STEERING_SMOOTHING=0.18
# Target post-beamforming RMS on a normalized 0.0-1.0 float scale. Raise it if
# the focused mono source is still too quiet; lower it if speech sounds clipped
# or aggressively amplified in a quiet room.
AUDIO_AGC_TARGET_RMS=0.12
AUDIO_MAX_GAIN=12.0
