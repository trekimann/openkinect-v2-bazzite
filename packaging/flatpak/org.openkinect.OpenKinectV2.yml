app-id: org.openkinect.OpenKinectV2
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: openkinect-control
finish-args:
  - --share=network
  - --socket=session-bus
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop
modules:
  - name: openkinect-control
    buildsystem: simple
    build-commands:
      - install -Dm755 packaging/flatpak/openkinect-control.py /app/bin/openkinect-control
    sources:
      - type: dir
        path: ../..
